# Builds https://giotto-suite.github.io/GiottoUtils/
#
# The build itself lives in giotto-suite/.github and is shared by every package
# site in the org, so the system-library set, the deploy invariant and the
# concurrency group are maintained in one place rather than copied into each
# repository. This file only says which site this is.
#
# Changes to the shared workflow reach this repo on its next build, since it is
# referenced at @main.
#
# This site is the link target other packages resolve to for GiottoUtils
# topics, so its reference pages must keep their URLs.

name: pkgdown

on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  site:
    # The reusable workflow can only narrow what the caller grants, so the
    # write permission the gh-pages deploy needs has to be declared here.
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      dependencies: '"hard"'   # do not use suggested dependencies
      extra-packages: "any::pkgdown, bioc::BiocStyle, local::."
