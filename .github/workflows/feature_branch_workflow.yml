name: Feature Branch Checks
on:
  pull_request:
    branches: [ "dev" ]

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      actions: read
    container:
      image: ghcr.io/giotto-suite/ci-giottosuite/ci-env
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
      - name: catch R deps not in container
        run: devtools::install_deps()
        shell: Rscript {0}
      - name: Build and install
        run: |
          R CMD build .
          R CMD INSTALL *.tar.gz
      - name: Set RETICULATE_PYTHON environment variable
        run: |
          echo "RETICULATE_PYTHON=/opt/miniconda/envs/r-reticulate/bin/python" >> $GITHUB_ENV
        shell: bash
      - name: Run tests
        env:
          # without this skip_on_cran() fires here too, and any test guarded by
          # it is skipped on CI rather than only on CRAN
          NOT_CRAN: "true"
        run: |
          library(testthat)
          library(GiottoUtils)
          # `package` + `load_package` are what make this run tests inside the
          # package namespace. Without them every test of an internal function
          # errors with "could not find function" instead of running.
          test_dir("tests/testthat",
              package = "GiottoUtils", load_package = "installed"
          )
        shell: Rscript {0}
